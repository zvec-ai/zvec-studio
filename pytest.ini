# Root-level pytest config.
# Mirrors the backend's pyproject.toml [tool.pytest] settings so that running
# bare `pytest` from the monorepo root works identically to `cd apps/backend && pytest`.
# The canonical config lives in apps/backend/pyproject.toml — keep in sync.
[pytest]
testpaths = apps/backend/tests
asyncio_mode = auto
addopts = -ra --strict-markers --strict-config
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: integration tests (hit HTTP layer)
    contract: OpenAPI contract tests via Schemathesis
    flaky: known-flaky tests, retried; do not block release
filterwarnings =
    error
    ignore::DeprecationWarning

name: release

# Cross-platform packaging for Zvec Studio.
#
# Triggers:
#   * `v*` tag push (real release)
#   * Manual `workflow_dispatch` (smoke-test the matrix without tagging)
#
# Each platform job runs:
#   1. PyInstaller -> single-file `zvec-studio-sidecar` binary.
#   2. `scripts/build_sidecar.py` to drop the binary into
#      `apps/desktop/src-tauri/binaries/` with the rustc host-triple suffix.
#   3. `tauri build --config tauri.bundle.conf.json` to produce installers.
#   4. Upload artifacts.
#   5. (macOS only) Ad-hoc re-sign the .app and recreate the DMG.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: bundle (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-aarch64
            runner: macos-14
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: windows-x86_64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Install Tauri WebDriver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked

      - name: Install Microsoft Edge WebDriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          msedgedriver-tool
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install backend (with packaging extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/backend[packaging]"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile=false

      - name: Build frozen sidecar binary
        run: python scripts/build_sidecar.py

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Inject version from git tag into Tauri config
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            # Strip pre-release suffix for Tauri (semver only): v0.1.1-rc.2 -> 0.1.1
            VERSION=$(echo "$TAG" | sed 's/-.*//')
            echo "Setting Tauri version: $VERSION"
            sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/src-tauri/tauri.conf.json
            rm -f apps/desktop/src-tauri/tauri.conf.json.bak
            grep version apps/desktop/src-tauri/tauri.conf.json
          fi

      - name: Clean stale bundle artifacts from cache
        shell: bash
        run: rm -rf apps/desktop/src-tauri/target/release/bundle

      - name: Build Tauri bundle
        working-directory: apps/desktop
        run: pnpm tauri build --config src-tauri/tauri.bundle.conf.json

      - name: Sign macOS bundle
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: bash scripts/post-build-sign.sh

      - name: Install desktop artifact
        id: desktop-install
        run: python scripts/desktop_install_smoke.py

      - name: Run installed desktop API smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/desktop_api_smoke.py --app-path "${{ steps.desktop-install.outputs.app_path }}" --port 17861

      - name: Run installed desktop API smoke
        if: runner.os != 'Linux'
        run: python scripts/desktop_api_smoke.py --app-path "${{ steps.desktop-install.outputs.app_path }}" --port 17861

      - name: Run installed desktop UI smoke (Linux)
        if: runner.os == 'Linux'
        env:
          DESKTOP_APP_PATH: ${{ steps.desktop-install.outputs.app_path }}
          ZVEC_PORT: "17862"
          ZVEC_STUDIO_DATA_DIR: ${{ github.workspace }}/artifacts/desktop-smoke/wdio-data
        run: xvfb-run -a pnpm --filter desktop e2e:installed

      - name: Run installed desktop UI smoke (Windows)
        if: runner.os == 'Windows'
        env:
          DESKTOP_APP_PATH: ${{ steps.desktop-install.outputs.app_path }}
          ZVEC_PORT: "17862"
          ZVEC_STUDIO_DATA_DIR: ${{ github.workspace }}/artifacts/desktop-smoke/wdio-data
        run: pnpm --filter desktop e2e:installed

      - name: Upload desktop smoke diagnostics
        if: failure() || always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ matrix.platform.name }}
          path: |
            artifacts/desktop-smoke/*.log
            artifacts/desktop-smoke/*.txt
            artifacts/desktop-smoke/wdio/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts/release
          find apps/desktop/src-tauri/target/release/bundle \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.deb' \
               -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp -v {} artifacts/release/ \;
          ls -la artifacts/release/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zvec-studio-${{ matrix.platform.name }}
          path: artifacts/release/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.rpm
          generate_release_notes: true
          draft: false

  publish-pypi:
    name: Publish to PyPI
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile=false

      - name: Install Python build tools
        run: pip install build wheel twine uv

      - name: Inject version from git tag
        run: |
          # Convert git tag to PEP 440: v0.1.0-rc.2 -> 0.1.0rc2
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(echo "$TAG" | sed 's/-rc\./rc/' | sed 's/-alpha\./a/' | sed 's/-beta\./b/')
          echo "Publishing version: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" apps/backend/pyproject.toml
          grep version apps/backend/pyproject.toml | head -1

      - name: Bundle frontend into Python package
        run: make build.pip

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload apps/backend/dist/*.whl

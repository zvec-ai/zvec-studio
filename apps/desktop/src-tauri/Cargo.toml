[package]
name = "zvec-studio-desktop"
version = "0.1.0"
description = "Zvec Studio desktop shell (Tauri v2)"
authors = ["Zvec Studio Team"]
edition = "2021"
rust-version = "1.77"

# Library + binary so the same code is reachable from `main.rs` and `cargo test`.
[lib]
name = "zvec_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zvec-studio-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "1"

[dev-dependencies]
# Used by sidecar tests to grab a free TCP port.
# (std::net::TcpListener is enough; no extra deps required.)

[features]
# Enables the embedded asset protocol when bundling for production.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
